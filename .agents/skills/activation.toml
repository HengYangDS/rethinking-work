[meta]
version = 2
source_of_truth = "repository"

[coverage]
required_primary_subjects = ["book-chinese-prose", "book-delivery"]
single_owner_subjects = ["book-chinese-prose", "book-delivery"]

[[skill]]
id = "book-chinese-prose"
path = ".agents/skills/book-chinese-prose/SKILL.md"
package_manifest = ".agents/skills/book-chinese-prose/package.toml"
subject = "book-chinese-prose"
operation = "write"
authority = "primary"
lifecycle = "active"
subjects = ["book-chinese-prose", "manuscript", "editing", "reading"]
path_globs = [
  "book/**",
  "publication/*.zh.txt",
  "exercises/**/*.zh.md",
]
intent_tokens = ["chinese", "prose", "edit", "rewrite", "read", "中文", "改写", "审读"]
pre_reads = [
  "AGENTS.md",
  "book/parts/writing.typ",
  ".agents/skills/book-chinese-prose/references/terms.md",
]
during_rules = [
  "keep facts, numbers, commands and quoted words unchanged",
  "one name per concept from references/terms.md",
]
post_checks = [
  "ethos prove --host --execute --gate book-prose --json",
]
boundary = "workflow-package-projection"

[[skill]]
id = "book-delivery"
path = ".agents/skills/book-delivery/SKILL.md"
package_manifest = ".agents/skills/book-delivery/package.toml"
subject = "book-delivery"
operation = "deliver"
authority = "primary"
lifecycle = "active"
subjects = ["book-delivery", "commit", "proof", "landing", "publication"]
path_globs = [
  "openspec/changes/**",
  "publication/acceptance/**",
  ".config/ci/**",
]
intent_tokens = ["commit", "review", "archive", "prove", "land", "publish", "release", "retire", "提交", "合入", "发布", "发版"]
pre_reads = [
  "AGENTS.md",
  "CONTRIBUTING.md",
  "docs/publication-acceptance.md",
]
during_rules = [
  "follow the current ETHOS result, not a remembered sequence",
  "one active Change in a lane",
]
post_checks = [
  "ethos status --root . --json",
]
boundary = "workflow-package-projection"
