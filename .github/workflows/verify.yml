name: Source verification
"on":
  push: null
  pull_request: null
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: source-verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      MISE_LOCKED: "1"
      MISE_EXEC_AUTO_INSTALL: "0"
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_DATA_DIR: ${{ github.workspace }}/build/runtime/ci/mise/data
      MISE_CACHE_DIR: ${{ github.workspace }}/build/runtime/ci/mise/cache
      MISE_STATE_DIR: ${{ github.workspace }}/build/runtime/ci/mise/state
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the exact event commit
        env:
          CHECKOUT_URL: ${{ github.server_url }}/${{ github.repository }}.git
          CHECKOUT_SHA: ${{ github.sha }}
        run: |-
          git init .
          git remote add origin "$CHECKOUT_URL"
          git -c protocol.version=2 fetch --no-tags --depth=1 origin "$CHECKOUT_SHA"
          git -c core.hooksPath=/dev/null checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$CHECKOUT_SHA"
      - name: Prepare checksum-bound Mise
        run: |-
          test "$(uname -s):$(uname -m)" = "Darwin:arm64"
          mkdir -p build/runtime/ci/bootstrap
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --connect-timeout 15 --max-time 180 --output build/runtime/ci/bootstrap/mise.tar.gz https://github.com/jdx/mise/releases/download/v2026.11.7/mise-v2026.11.7-macos-arm64.tar.gz
          printf '%s  %s\n' '92f1b9f68b6031a9f77938a0ff8dfd7a77fe9cd918c5b09d0ed434f06ebbd3f2' build/runtime/ci/bootstrap/mise.tar.gz | shasum --algorithm 256 --check
          tar -xzf build/runtime/ci/bootstrap/mise.tar.gz -C build/runtime/ci/bootstrap --strip-components=2 mise/bin/mise
          build/runtime/ci/bootstrap/mise --version
      - name: Check projections, formatting and all companion contracts
        run: |-
          build/runtime/ci/bootstrap/mise install node python just npm:prettier duckdb ast-grep github:oasdiff/oasdiff cue
          build/runtime/ci/bootstrap/mise exec node python just npm:prettier duckdb ast-grep github:oasdiff/oasdiff cue -- just --justfile publication/justfile ci
          git diff --exit-code -- .config/mise
