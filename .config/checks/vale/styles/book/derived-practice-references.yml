# A reference to a practice, 练一, is derived too (`#chapref(<label>)`), but a practice's own name stands in
# quotes where it is declared, `"练一"`; a rule with this token sets aside the other references it shares a file
# with, so it is kept apart. 练 is also a word: 训练一遍 and 再练一个 are not references, so the character before
# and after the numeral is excluded where it makes a word.
extends: existence
message: "'%s' is written by hand; derive it with #chapref(<label>)."
level: error
nonword: true
tokens:
  - '[^"训再]练[一二三四](?:[^遍个次下]|$)'
tests:
  - name: a written practice reference is found
    input: 见练一与练三。
    # One match takes the character after the numeral, so the next reference begins inside it; the first is enough
    # to refuse the line.
    want: |
      1:1:book.derived-practice-references:'见练一与' is written by hand; derive it with #chapref(<label>).
  - name: the word 练 is not a reference
    input: 换一个更强的模型或者训练一遍都无法弥补。再练一个。
    absent: book.derived-practice-references
  - name: a declared practice name is not a reference
    input: |
      #chapter("二 / 一个人", "练一", "思考的练习", "五个练习。")<practice-thinking>
    absent: book.derived-practice-references
