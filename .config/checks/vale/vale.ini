# The repository's Vale increment. ETHOS's prose gate runs it on Markdown after its shipped policy, where it adds
# nothing; the `book-prose` gate runs it on the book's Typst sources, which Vale reads as Markdown, so code spans and
# code blocks are skipped. The `book` style holds the book's decided wording and the decidable cases of GB/T 15834.
[DEFAULT]
StylesPath = styles
MinAlertLevel = suggestion

[formats]
typ = md

[*.typ]
BasedOnStyles = book
# A sample box titled 原话 holds a speaker's own words, quoted as said.
TokenIgnores = #note\("原话", \[[^\]]*\]\)
