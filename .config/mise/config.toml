[tasks.build]
description = "Render declared diagrams and build the candidate PDF"
run = "just --justfile publication/justfile build"

[tasks.check]
description = "Check authored inputs through native formatting and Typst readers"
run = "just --justfile publication/justfile check"

[tasks.fix]
description = "Format the declared authored files"
run = "just --justfile publication/justfile format"

[tasks.render]
description = "Render every PDF page for visual review"
run = "just --justfile publication/justfile render"
[settings]
locked = true
minimum_release_age = "24h"

[tools]
node = "26.13.1"
python = "3.12.16"
typst = "0.15.1"
just = "1.59.0"
"npm:@mermaid-js/mermaid-cli" = "12.2.0"
"npm:prettier" = "3.10.1"
duckdb = "2.0.0"
ast-grep = "0.51.3"
"github:oasdiff/oasdiff" = "1.39.0"
cue = "0.17.1"
# The test environment is synchronized and run by the locked uv, never by one found on PATH.
uv = "0.13.9"

# The ETHOS release declaration as published with v0.2.0-beta.11.
[tools."http:ethos"]
version = "0.2.0-beta.11"

[tools."http:ethos".platforms]
linux-arm64 = { url = "https://github.com/HengYangDS/ethos/releases/download/v0.2.0-beta.11/ethos-0.2.0-beta.11-linux-arm64.tar.gz", checksum = "sha256:d619560f9cd7812303d550721722afa200b2bc152639ec5ac3ab68ef2d50b292", bin_path = "ethos/bin" }
linux-x64 = { url = "https://github.com/HengYangDS/ethos/releases/download/v0.2.0-beta.11/ethos-0.2.0-beta.11-linux-x64.tar.gz", checksum = "sha256:d8eb1d563015d624fee5d4fbf3b3f50e952e8e9cf603262bbd5d337ff808c30d", bin_path = "ethos/bin" }
macos-arm64 = { url = "https://github.com/HengYangDS/ethos/releases/download/v0.2.0-beta.11/ethos-0.2.0-beta.11-macos-arm64.tar.gz", checksum = "sha256:59a2b154e82b9fb5a5f94f12cba6eb5825102235a7e4e802b60bafe82f8b966e", bin_path = "ethos/bin" }
windows-arm64 = { url = "https://github.com/HengYangDS/ethos/releases/download/v0.2.0-beta.11/ethos-0.2.0-beta.11-windows-arm64.tar.gz", checksum = "sha256:6c48a4e784c3e6f92331f670fb4533f4cf590ce511f771b5f898edd2138a534d", bin_path = "ethos/bin" }
windows-x64 = { url = "https://github.com/HengYangDS/ethos/releases/download/v0.2.0-beta.11/ethos-0.2.0-beta.11-windows-x64.tar.gz", checksum = "sha256:85a914179bd660da1f7f0e8a1995fcbf195eb36240c3346aec304ac25da4c826", bin_path = "ethos/bin" }

[tasks.ci-supply]
description = "Supply a CI runner's account with the fonts, Typst packages, test environment and PDF tools the full proof reads"
run = "just --justfile publication/justfile ci-supply"

[tasks.bootstrap]
description = "Inspect existing publication supply without installing software"
run = "just --justfile publication/justfile bootstrap"
