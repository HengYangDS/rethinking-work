[settings]
locked = true
minimum_release_age = "24h"

[tools]
node = "26.13.1"
# The Python line the tests, the exercises and the practice pack run on; the lock pins its release.
python = "3.12"
typst = "0.15.1"
just = "1.59.0"
"npm:prettier" = "3.10.1"
duckdb = "2.0.0"
ast-grep = "0.51.3"
"github:oasdiff/oasdiff" = "1.39.0"
cue = "0.17.1"
# The book's prose rules (the book style in .config/checks/vale) run with this Vale.
vale = "3.28.1"
# The test environment is synchronized and run by the locked uv, never by one found on PATH.
uv = "0.13.9"

# The ETHOS release; the lock holds each platform's checksum.
[tools."http:ethos"]
version = "0.2.0-beta.12"

[tools."http:ethos".platforms]
linux-x64 = { url = "https://github.com/HengYangDS/ethos/releases/download/v{{version}}/ethos-{{version}}-linux-x64.tar.gz", bin_path = "ethos/bin" }
macos-arm64 = { url = "https://github.com/HengYangDS/ethos/releases/download/v{{version}}/ethos-{{version}}-macos-arm64.tar.gz", bin_path = "ethos/bin" }

[tasks.ci-supply]
description = "Supply a CI runner's account with the fonts, Typst packages, test environment and PDF tools the full proof reads"
run = "just --justfile publication/justfile ci-supply"

# ETHOS's repository paradigm asks every repository for these toolchain verbs; each calls its Just recipe.
[tasks.bootstrap]
description = "Inspect existing publication supply without installing software"
run = "just --justfile publication/justfile bootstrap"

[tasks.check]
description = "Check authored inputs through native formatting and Typst readers"
run = "just --justfile publication/justfile check"

[tasks.fix]
description = "Format the declared authored files"
run = "just --justfile publication/justfile format"
