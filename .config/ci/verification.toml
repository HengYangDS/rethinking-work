name = "Repository verification"
accepted_branch = "dev"
release_branch = "main"
timeout_minutes = 45

[supply]
mise_version = "2026.11.14"

[supply.checks]
github = ["mise run ci-supply"]
gitlab = ["mise run ci-supply"]

[github]
runners = ["macos-latest"]

[gitlab.variables]
MISE_CONFIG_DIR = "$CI_PROJECT_DIR/build/runtime/work/mise-config"
MISE_CEILING_PATHS = "$CI_PROJECT_DIR/.."
MISE_TRUSTED_CONFIG_PATHS = "$CI_PROJECT_DIR/.config/mise/config.toml"
MISE_YES = "1"
# Every release tag, not only those the pipeline's commit reaches: the acceptance test names the last release
# by the review's time (tests/test_acceptance.py). GitLab's default flags are "--prune --quiet".
GIT_FETCH_EXTRA_FLAGS = "--prune --quiet --tags"

[gitlab.runners.macos]
system = "macos"
review_tags = ["macos-latest", "review"]
protected_tags = ["macos-latest", "protected"]
