stages:
  - verify
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH =~ /^proposal\// && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH =~ /^proposal\// || $CI_COMMIT_TAG =~ /^v[^\/]*$/
variables:
  MISE_LOCKED: "1"
  MISE_EXEC_AUTO_INSTALL: "0"
  MISE_TRUSTED_CONFIG_PATHS: $CI_PROJECT_DIR
  GIT_DEPTH: "1"
  GIT_STRATEGY: clone
  GIT_SUBMODULE_STRATEGY: none
  MISE_CONFIG_DIR: $CI_PROJECT_DIR/build/runtime/ci/mise/config
  MISE_CEILING_PATHS: $CI_PROJECT_DIR/..
  MISE_JOBS: "1"
  MISE_YES: "1"
verify:macos:review:
  stage: verify
  tags:
    - ci-macos-arm64-review
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" || ($CI_COMMIT_BRANCH =~ /^proposal\// && $CI_PIPELINE_SOURCE == "push")
  timeout: 20m
  interruptible: true
  script:
    - mise --version
    - mise install node python just npm:prettier duckdb ast-grep github:oasdiff/oasdiff cue
    - mise exec node python just npm:prettier duckdb ast-grep github:oasdiff/oasdiff cue -- just --justfile publication/justfile ci-identity macos:aarch64 "$CI_COMMIT_SHA"
    - mise exec node python just npm:prettier duckdb ast-grep github:oasdiff/oasdiff cue -- just --justfile publication/justfile ci
    - git diff --exit-code -- .config/mise
verify:macos:protected:
  stage: verify
  tags:
    - ci-macos-arm64-shell
  rules:
    - if: $CI_COMMIT_REF_PROTECTED == "true" && ($CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_TAG =~ /^v[^\/]*$/)
  timeout: 20m
  interruptible: true
  script:
    - mise --version
    - mise install node python just npm:prettier duckdb ast-grep github:oasdiff/oasdiff cue
    - mise exec node python just npm:prettier duckdb ast-grep github:oasdiff/oasdiff cue -- just --justfile publication/justfile ci-identity macos:aarch64 "$CI_COMMIT_SHA"
    - mise exec node python just npm:prettier duckdb ast-grep github:oasdiff/oasdiff cue -- just --justfile publication/justfile ci
    - git diff --exit-code -- .config/mise
