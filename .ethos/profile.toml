profile_id = "rethinking-work"

[openspec]
material_paths = [
  "**",
]

[proof]
# The repository gates a proof runs; a gate declared below and not listed here never runs.
code_correctness_gates = ["source-behavior", "source-static-analysis", "formatting", "book-prose"]

[proof.code_correctness_map]
behavior = "source-behavior"
static-analysis = "source-static-analysis"

[[proof.gates]]
id = "source-behavior"
kind = "test"
command = ["just", "--justfile", "publication/justfile", "test-proof", "{native_output}"]
verification_providers = ["ethos.adapters.gates.python_quality:behavior_report"]
# What this test run holds the tests to: tests/README.md.
dimensions = ["behavior", "test", "coverage", "publication-inputs"]
evidence_class = "proof"
trust_bearing = true
writes_files = true
network_policy = "offline"
# A hang guard, not an acceptance limit: the gate takes under 20 s locally; hosted macOS runners
# have taken up to twice the local time and once more than twice, and the GitLab guest runners take
# less. The document checks bound their own time; see tests/README.md.
timeout_seconds = 180

[[proof.gates.native_outputs]]
path = "tests.xml"
format = "junit-xml"
sessions = ["publication-tests"]

[[proof.gates.native_outputs]]
path = "pytest.jsonl"
format = "pytest-jsonl"
sessions = ["publication-tests"]

[[proof.gates.native_outputs]]
path = "coverage.xml"
format = "cobertura-xml"
sessions = ["publication-tests"]

[[proof.gates]]
id = "source-static-analysis"
kind = "static"
providers = ["ethos.adapters.gates.code_quality:static_report"]
dimensions = ["static-analysis"]
evidence_class = "proof"
trust_bearing = true
writes_files = false
network_policy = "offline"

[[proof.gates]]
id = "book-prose"
kind = "lint"
# The book's decided wording and decidable punctuation, read from its Typst sources; ETHOS's own
# prose gate reads Markdown only. The rules and their cases: the book style in .config/checks/vale.
command = ["just", "--justfile", "publication/justfile", "prose-check"]
dimensions = ["prose"]
evidence_class = "proof"
trust_bearing = true
writes_files = false
timeout_seconds = 60
network_policy = "offline"

[[proof.gates]]
id = "formatting"
kind = "lint"
command = ["just", "--justfile", "publication/justfile", "format-check"]
dimensions = ["format"]
evidence_class = "proof"
trust_bearing = true
writes_files = false
timeout_seconds = 120
network_policy = "offline"
