profile_id = "rethinking-work"

[openspec]
material_paths = [
  "**",
]

[proof]
code_correctness_gates = ["source-behavior", "source-static-analysis", "publication-inputs", "formatting"]

[proof.code_correctness_map]
behavior = "source-behavior"
static-analysis = "source-static-analysis"

[[proof.gates]]
id = "source-behavior"
kind = "test"
command = ["just", "--justfile", "publication/justfile", "test-proof", "{native_output}"]
verification_providers = ["ethos.adapters.gates.python_quality:behavior_report"]
dimensions = ["behavior", "test", "coverage"]
evidence_class = "proof"
trust_bearing = true
writes_files = true
network_policy = "offline"
# A hang guard, not an acceptance limit: the gate took 16-17 s locally (2026-11-19, after the
# test-performance Change). Hosted macOS runners have taken up to twice the local time for the
# whole proof, and once more than twice for the publication-inputs gate (over 300 s against 142 s
# at 4b76625); the GitLab guest runners take less than the local time. The document checks bound
# their own time; see tests/README.md.
timeout_seconds = 180

[[proof.gates.native_outputs]]
path = "tests.xml"
format = "junit-xml"
sessions = ["publication-tests-3.12"]

[[proof.gates.native_outputs]]
path = "pytest.jsonl"
format = "pytest-jsonl"
sessions = ["publication-tests-3.12"]

[[proof.gates.native_outputs]]
path = "coverage.xml"
format = "cobertura-xml"
sessions = ["publication-tests-3.12"]

[[proof.gates]]
id = "source-static-analysis"
kind = "static"
providers = ["ethos.adapters.gates.code_quality:static_report"]
dimensions = ["static-analysis"]
evidence_class = "proof"
trust_bearing = true
writes_files = false
network_policy = "offline"

[[proof.gates]]
id = "publication-inputs"
kind = "test"
command = ["just", "--justfile", "publication/justfile", "test"]
dimensions = ["publication-inputs"]
evidence_class = "proof"
trust_bearing = true
writes_files = true
# A hang guard, not an acceptance limit: the gate took 15-17 s locally (2026-11-19, after the
# test-performance Change). Hosted macOS runners have taken up to twice the local time for the
# whole proof, and once more than twice for the publication-inputs gate (over 300 s against 142 s
# at 4b76625); the GitLab guest runners take less than the local time. The document checks bound
# their own time; see tests/README.md.
timeout_seconds = 180
network_policy = "offline"

[[proof.gates]]
id = "formatting"
kind = "lint"
command = ["just", "--justfile", "publication/justfile", "format-check"]
dimensions = ["format"]
evidence_class = "proof"
trust_bearing = true
writes_files = false
timeout_seconds = 120
network_policy = "offline"
