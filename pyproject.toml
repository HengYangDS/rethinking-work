[project]
name = "rethinking-work"
description = "Native verification tools for the Rethinking Work publication"
requires-python = ">=3.12,<3.13"
version = "0.1.0"
dependencies = []

[tool.uv]
package = false
default-groups = ["test"]

[dependency-groups]
test = [
  "pytest==9.2.0",
  "pytest-cov==7.1.0",
  "coverage==7.17.2",
  "iniconfig==2.3.1",
  "packaging==26.3",
  "pluggy==1.7.0",
  "pygments==2.21.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["tests", "exercises"]
patch = ["subprocess"]
relative_files = false

[tool.coverage.report]
show_missing = true
