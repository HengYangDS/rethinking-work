[project]
name = "rethinking-work"
description = "Native verification tools for the Rethinking Work publication"
requires-python = ">=3.12,<3.13"
dynamic = ["version"]
dependencies = []

[tool.uv]
package = false
default-groups = ["test"]
# The repository's own release age for Python packages; the lock records the span, not a date.
exclude-newer = "24 hours"

[dependency-groups]
test = [
  "pytest==9.2.0",
  "pytest-cov==7.1.0",
  "coverage==7.17.3",
  "iniconfig==2.3.1",
  "packaging==26.3",
  "pluggy==1.7.0",
  "pygments==2.21.0",
  "pytest-reportlog==1.0.0",
]
