[project]
name = "rethinking-work"
description = "Native verification tools for the Rethinking Work publication"
requires-python = ">=3.12,<3.13"
dynamic = ["version"]
dependencies = []

[tool.uv]
package = false
default-groups = ["test"]

[dependency-groups]
test = [
  "pytest==9.2.0",
  "pytest-cov==7.1.0",
  "coverage==7.17.2",
  "iniconfig==2.3.1",
  "packaging==26.3",
  "pluggy==1.7.0",
  "pygments==2.21.0",
]

[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []

[tool.setuptools.dynamic]
version = { file = "VERSION" }
