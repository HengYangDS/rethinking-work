[project]
name = "rethinking-work"
description = "Native verification tools for the Rethinking Work publication"
# The Python line .config/mise/config.toml installs, repeated here for uv and ETHOS, which read it from this
# table; uv refuses an environment whose interpreter falls outside it.
requires-python = ">=3.12,<3.13"
# The version is the edition's, read from VERSION when a resolution needs the project's metadata.
dynamic = ["version"]
dependencies = []

[tool.uv]
package = false
default-groups = ["test"]
# The repository's own release age for Python packages; the lock records the span, not a date.
exclude-newer = "24 hours"

[dependency-groups]
test = [
  "coverage",
  "pytest",
  "pytest-cov",
  "pytest-reportlog",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "VERSION"
pattern = "(?P<version>.+)"
