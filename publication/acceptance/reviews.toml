# The reviews a head that changes the book's text or exercises needs before it is proved and landed
# (docs/publication-acceptance.md, "Check complete meaning"); tests/test_acceptance.py reads this record in the
# proof and both CIs. Each entry holds exactly the fields below and nothing else: no reviewer's words and no
# path to local evidence. The record keeps the last release's reading, the reviews that cover that release's
# trees and every review read after them; Git keeps the rest. A review with an open point is not recorded.
#
# [[commands]]  the printed commands and the prose beside them, against the run records; keyed by the trees
#               of book/ and exercises/ (`git rev-parse <subject>:book`) and by the Python line the commands
#               name, as `.config/mise/config.toml` declares it.
#   subject, the commit read; blocks_against, the run records' baseline the blocks were paired with;
#   prose_against, the commit the prose was compared with; pdf, the SHA-256 of the PDF read, or "none" for a
#   text-only review; read, when the findings were written, with its offset; verdict, "no finding" or
#   "settled"; settled and declined, how many points were settled and how many declined with a reason.
# [[reading]]   every changed passage, read by a reader who did not write it; keyed by the tree of book/:
#   subject, against, read, verdict, settled and declined, as above.
# [[release]]   the release PDF checked before its tag (cover, metadata date, blocks, page text); keyed by the
#   PDF's SHA-256: version, pdf, read, verdict, settled and declined. The release procedure reads it.

